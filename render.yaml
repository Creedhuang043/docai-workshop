services:
  - type: web
    name: docai-demo
    runtime: python
    buildCommand: pip install -r demo_requirements.txt
    startCommand: python demo_backend_main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false   # 部署時 Render 會提示手動輸入，不會存進 repo
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      # Day 3 工作流（多輪工具呼叫）目前對 Gemini 3.x 思考型模型有已知相容性問題，
      # 若帳號有舊模型配額可設 GEMINI_WORKFLOW_MODEL=gemini-2.0-flash 繞過，詳見 .env.example

services:
  - type: web
    name: docai-demo
    runtime: python
    buildCommand: pip install -r demo_requirements.txt
    startCommand: python demo_backend_main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false   # 部署時 Render 會提示手動輸入，不會存進 repo
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能文檔分析系統 - DocAI Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .subtitle {
            font-size: 1rem;
            opacity: 0.9;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        textarea, input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        textarea:focus, input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
            background-color: #f8f9ff;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #e0e0e0;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .result-section h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .result-content {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            font-family: "Monaco", "Courier New", monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 300px;
            overflow-y: auto;
        }

        .feature-list {
            list-style: none;
            margin-top: 15px;
        }

        .feature-list li {
            padding: 8px 0;
            color: #666;
            border-bottom: 1px solid #eee;
        }

        .feature-list li:before {
            content: "✓ ";
            color: #667eea;
            font-weight: bold;
            margin-right: 8px;
        }

        .message {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .button-group {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 智能文檔分析系統</h1>
            <p class="subtitle">DocAI 次世代工作坊 - 完整課程 DEMO</p>
        </header>

        <div class="grid">
            <div class="card">
                <h2>📝 文檔輸入</h2>

                <div class="form-group">
                    <label for="docType">分析類型：</label>
                    <select id="docType">
                        <option value="extraction">✨ 數據提取 (Day 2)</option>
                        <option value="workflow">🔄 工作流處理 (Day 3)</option>
                        <option value="rag">🔍 RAG 檢索 (Day 5-6)</option>
                        <option value="parallel">⚡ 並行分析 (Day 4)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="docInput">輸入文檔或提問：</label>
                    <textarea id="docInput" placeholder="例如：我想訂購 3 台筆記型電腦，電話是 0912-345-678，送到台北市"></textarea>
                </div>

                <div id="messageArea"></div>

                <div class="button-group">
                    <button class="btn-primary" onclick="analyzeDocument()">🚀 開始分析</button>
                    <button class="btn-secondary" onclick="clearForm()">🗑️ 清空</button>
                </div>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <span>AI 處理中...</span>
                </div>
            </div>

            <div class="card">
                <h2>📚 課程內容</h2>
                <ul class="feature-list">
                    <li><strong>Day 1:</strong> 前端基礎 (HTML/CSS)</li>
                    <li><strong>Day 2:</strong> LangChain 鏈式處理</li>
                    <li><strong>Day 3:</strong> Tool 調用 & LangGraph</li>
                    <li><strong>Day 4:</strong> 高級主題 (反射、緩存)</li>
                    <li><strong>Day 5-6:</strong> RAG 檢索增強</li>
                </ul>

                <h3 style="margin-top: 25px; color: #667eea;">🎯 DEMO 展示</h3>
                <p style="margin-top: 10px; color: #666; font-size: 0.95rem;">
                    這個系統綜合展示了整個工作坊的核心技術
                </p>
            </div>
        </div>

        <div id="resultsContainer"></div>
    </div>

    <footer>
        <p>💡 次世代 DocAI 系統工作坊 - 由老師提供 | 學生實作 DEMO</p>
    </footer>

    <script>
        // 自動偵測 API 位址：本地開發用 localhost:8000，部署後用同一個 origin
        const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
            ? 'http://localhost:8000'
            : window.location.origin;

        async function analyzeDocument() {
            const docType = document.getElementById('docType').value;
            const docInput = document.getElementById('docInput').value.trim();
            const messageArea = document.getElementById('messageArea');
            const loading = document.getElementById('loading');

            if (!docInput) {
                showMessage('請輸入文檔或提問內容', 'error', messageArea);
                return;
            }

            document.getElementById('resultsContainer').innerHTML = '';
            messageArea.innerHTML = '';
            loading.classList.add('active');

            try {
                const response = await fetch(`${API_BASE}/analyze`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        doc_type: docType,
                        content: docInput
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                displayResults(data, docType);
                showMessage('✅ 分析完成！', 'success', messageArea);

            } catch (error) {
                console.error('Error:', error);
                showMessage(`❌ 分析失敗: ${error.message}`, 'error', messageArea);
            } finally {
                loading.classList.remove('active');
            }
        }

        function displayResults(data, docType) {
            const container = document.getElementById('resultsContainer');
            let html = '';

            if (docType === 'extraction') {
                html += `
                    <div class="result-section">
                        <h3>📊 數據提取結果</h3>
                        <div class="result-content">${JSON.stringify(data.extraction, null, 2)}</div>
                    </div>
                `;
            } else if (docType === 'workflow') {
                html += `
                    <div class="result-section">
                        <h3>🔄 工作流執行結果</h3>
                        <div class="result-content">${JSON.stringify(data.workflow, null, 2)}</div>
                    </div>
                `;
            } else if (docType === 'rag') {
                html += `
                    <div class="result-section">
                        <h3>🔍 RAG 檢索結果</h3>
                        <div style="margin-bottom: 15px;">
                            <strong>相關文檔：</strong><br/>
                            ${data.rag.retrieved_docs.map(doc => `<div style="margin: 8px 0; padding: 8px; background: #f0f0f0; border-radius: 4px;">${doc}</div>`).join('')}
                        </div>
                        <div>
                            <strong>AI 回答：</strong><br/>
                            <div style="margin-top: 8px; padding: 12px; background: #f8f9fa; border-radius: 8px;">${data.rag.answer}</div>
                        </div>
                    </div>
                `;
            } else if (docType === 'parallel') {
                html += `
                    <div class="result-section">
                        <h3>⚡ 並行分析結果</h3>
                        <div style="margin-bottom: 15px;">
                            <strong>LinkedIn 專家觀點：</strong><br/>
                            <div style="margin-top: 8px; padding: 12px; background: #f0f0f0; border-radius: 8px;">${data.parallel.linkedin}</div>
                        </div>
                        <div>
                            <strong>Instagram 網紅觀點：</strong><br/>
                            <div style="margin-top: 8px; padding: 12px; background: #f0f0f0; border-radius: 8px;">${data.parallel.instagram}</div>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        function showMessage(message, type, messageArea) {
            const messageEl = document.createElement('div');
            messageEl.className = `message ${type}`;
            messageEl.textContent = message;
            messageArea.innerHTML = '';
            messageArea.appendChild(messageEl);
        }

        function clearForm() {
            document.getElementById('docInput').value = '';
            document.getElementById('docType').value = 'extraction';
            document.getElementById('resultsContainer').innerHTML = '';
            document.getElementById('messageArea').innerHTML = '';
        }
    </script>
</body>
</html>
